name: お知らせ自動更新

on:
  schedule:
    # 6時間ごと（JST 3:17 / 9:17 / 15:17 / 21:17）
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: note・PR TIMESから最新情報を取得
        run: python3 scripts/update-news.py

      - name: 変更がある場合だけ反映
        run: |
          if git diff --quiet -- data/news.json; then
            echo "更新はありません"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git commit -m "chore: お知らせを自動更新"
          git push
